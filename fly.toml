# Fly.io — https://fly.io/docs/reference/configuration/
# 1) fly launch --no-deploy --copy-config      (pick your own app name / region)
# 2) fly volumes create paxton_data --size 1
# 3) fly secrets set SESSION_ID="PAXTON-MD:..." WOLVAREX_API_KEY="..."
# 4) fly deploy
app = "paxton-md"            # change to a unique name
primary_region = "jnb"       # change to the region closest to you (fly platform regions)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  BOT_NAME = "Paxton MD"
  TZ = "UTC"
  PERSIST_DIR = "/persist"   # settings + WhatsApp session live on the volume

[[mounts]]
  source = "paxton_data"
  destination = "/persist"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # a WhatsApp bot must stay connected
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

kill_signal = "SIGTERM"
kill_timeout = 15
